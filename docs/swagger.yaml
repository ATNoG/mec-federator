basePath: /federation/v1
definitions:
  dto.AccessTokenRequestData:
    properties:
      clientId:
        type: string
      clientSecret:
        type: string
    type: object
  dto.AppInstanceNodeMigrateRequest:
    properties:
      kduId:
        type: string
      node:
        type: string
      nsId:
        type: string
      vnfId:
        type: string
    type: object
  dto.DisableAppInstanceKDURequest:
    properties:
      kduId:
        type: string
      nsId:
        type: string
    type: object
  dto.EnableAppInstanceKDURequest:
    properties:
      kduId:
        type: string
      node:
        type: string
      nsId:
        type: string
    type: object
  dto.GetArtefactResponse:
    properties:
      appProviderId:
        type: string
      artefactDescription:
        type: string
      artefactDescriptorFileFormat:
        $ref: '#/definitions/models.ArtefactFileFormat'
      artefactDescriptorType:
        $ref: '#/definitions/models.ArtefactDescriptorType'
      artefactId:
        type: string
      artefactName:
        type: string
      artefactVersionInfo:
        type: string
      artefactVirtType:
        $ref: '#/definitions/models.ArtefactVirtType'
      objectRepoLocation:
        $ref: '#/definitions/models.ObjectRepoLocation'
    type: object
  dto.Instance:
    properties:
      kdus:
        additionalProperties:
          type: string
        type: object
      ns_id:
        type: string
      vnf_id:
        type: string
    type: object
  dto.InstantiateApplicationRequest:
    properties:
      appId:
        type: string
      appInstCallbackLink:
        type: string
      appProviderId:
        type: string
      appVersion:
        type: string
      config:
        type: string
      transactionId:
        type: string
      zoneInfo:
        type: string
    type: object
  dto.OnboardApplicationRequest:
    properties:
      appId:
        type: string
      appName:
        type: string
      artefactId:
        type: string
    type: object
  dto.OrchAppI:
    properties:
      app_pkg_id:
        type: string
      appi_id:
        type: string
      domain:
        type: string
      instances:
        additionalProperties:
          additionalProperties:
            $ref: '#/definitions/dto.Instance'
          type: object
        type: object
      ns_pkg_id:
        type: string
      vnf_pkg_id:
        type: string
    type: object
  dto.OrchMehMetricsRequestData:
    properties:
      federation-meh-metrics:
        additionalProperties: {}
        type: object
    type: object
  models.AccessToken:
    properties:
      accessToken:
        type: string
      clientId:
        type: string
      expiresAt:
        type: string
    type: object
  models.Application:
    properties:
      appId:
        type: string
      appPkgId:
        description: is empty if the app instance is running on a partner zone
        type: string
      artefactId:
        type: string
      description:
        type: string
      federationContextId:
        type: string
      name:
        type: string
    type: object
  models.ArtefactDescriptorType:
    enum:
    - HELM
    - TERRAFORM
    - ANSIBLE
    - SHELL
    - COMPONENTSPEC
    type: string
    x-enum-varnames:
    - HELM
    - TERRAFORM
    - ANSIBLE
    - SHELL
    - COMPONENTSPEC
  models.ArtefactFileFormat:
    enum:
    - ZIP
    - TAR
    - TEXT
    - TARGZ
    type: string
    x-enum-varnames:
    - ZIP
    - TAR
    - TEXT
    - TARGZ
  models.ArtefactVirtType:
    enum:
    - VM_TYPE
    - CONTAINER_TYPE
    type: string
    x-enum-varnames:
    - VM_TYPE
    - CONTAINER_TYPE
  models.ComputeResourceInfo:
    properties:
      cpuArchType:
        description: CPU Instruction Set Architecture (ISA) E.g., Intel, Arm etc.
        type: string
      cpuExclusivity:
        description: Support for exclusive CPUs
        type: boolean
      diskStorage:
        description: Amount of disk storage in Gbytes for a given ISA type
        type: integer
      fpga:
        description: Number of FPGAs available for a given ISA type
        type: integer
      gpu:
        items:
          $ref: '#/definitions/models.GpuInfo'
        type: array
      hugepages:
        items:
          $ref: '#/definitions/models.HugePage'
        type: array
      memory:
        description: Amount of RAM in Mbytes
        type: integer
      numCPU:
        type: string
      vpu:
        description: Number of Intel VPUs available for a given ISA type
        type: integer
    type: object
  models.CpuArchType:
    enum:
    - ISA_X86
    - ISA_X86_64
    - ISA_ARM_64
    type: string
    x-enum-varnames:
    - X86
    - X86_64
    - ARM_64
  models.FederationHealthInfo:
    properties:
      federationStartTime:
        type: string
      federationStatus:
        $ref: '#/definitions/models.State'
      numOfAcceptedZones:
        type: string
      numOfActiveAlarms:
        type: string
      numOfApplications:
        type: string
    type: object
  models.FederationMetaInfo:
    properties:
      allowedFixedNetworkIds:
        items:
          type: string
        type: array
      allowedMobileNetworkIds:
        $ref: '#/definitions/models.MobileNetworkIds'
      edgeDiscoveryServiceEndPoint:
        $ref: '#/definitions/models.ServiceEndpoint'
      lcmServiceEndPoint:
        $ref: '#/definitions/models.ServiceEndpoint'
      offeredAvailabilityZones:
        items:
          $ref: '#/definitions/models.ZoneDetails'
        type: array
      platformCaps:
        items:
          type: string
        type: array
    required:
    - platformCaps
    type: object
  models.FederationPatchParams:
    properties:
      addFixedNetworkIds:
        items:
          type: string
        type: array
      addMobileNetworkIds:
        $ref: '#/definitions/models.MobileNetworkIds'
      modificationDate:
        type: string
      objectType:
        description: Must be either "MOBILE_NETWORK_CODES" or "FIXED_NETWORK_CODES"
        type: string
      operationType:
        description: Must be either "ADD_CODES", "REMOVE_CODES" or "UPDATE_CODES"
        type: string
      removeFixedNetworkIds:
        items:
          type: string
        type: array
      removeMobileNetworkIds:
        $ref: '#/definitions/models.MobileNetworkIds'
    type: object
  models.FederationRequestData:
    properties:
      accessToken:
        $ref: '#/definitions/models.AccessToken'
      initialDate:
        description: Time zone info of the federation initiated by the originating
          OP
        type: string
      origOPCountryCode:
        type: string
      origOPFederationId:
        type: string
      origOPFixedNetworkCodes:
        items:
          type: string
        type: array
      origOPMobileNetworkCodes:
        $ref: '#/definitions/models.MobileNetworkIds'
      partnerStatusLink:
        type: string
    required:
    - accessToken
    - initialDate
    - partnerStatusLink
    type: object
  models.FederationResponseData:
    properties:
      edgeDiscoveryServiceEndPoint:
        $ref: '#/definitions/models.ServiceEndpoint'
      federationContextId:
        type: string
      federationExpiryDate:
        description: Date and Time zone info of the existing federation expiry
        type: string
      federationRenewalDate:
        description: Date and Time zone info of the existing federation renewal. Shall
          be less than federationExpiryDate
        type: string
      lcmServiceEndPoint:
        $ref: '#/definitions/models.ServiceEndpoint'
      offeredAvailabilityZones:
        description: List of zones, which the operator platform wishes to make available
          to developers/ISVs of requesting operator platform.
        items:
          $ref: '#/definitions/models.ZoneDetails'
        type: array
      partnerOPCountryCode:
        type: string
      partnerOPFederationId:
        type: string
      partnerOPFixedNetworkCodes:
        items:
          type: string
        type: array
      partnerOPMobileNetworkCodes:
        $ref: '#/definitions/models.MobileNetworkIds'
      platformCaps:
        items:
          type: string
        type: array
    required:
    - edgeDiscoveryServiceEndPoint
    - federationContextId
    - lcmServiceEndPoint
    - partnerOPCountryCode
    - platformCaps
    type: object
  models.Flavour:
    properties:
      cpuArchType:
        $ref: '#/definitions/models.CpuArchType'
      cpuExclusivity:
        description: Support for exclusive CPUs
        type: boolean
      flavourId:
        type: string
      fpga:
        description: Number of FPGAs
        type: integer
      gpu:
        items:
          $ref: '#/definitions/models.GpuInfo'
        type: array
      hugepages:
        items:
          $ref: '#/definitions/models.HugePage'
        type: array
      memorySize:
        description: Amount of RAM in Mbytes
        type: integer
      numCPU:
        description: Number of available vCPUs
        type: integer
      storageSize:
        description: Amount of disk storage in Gbytes
        type: integer
      supportedOSTypes:
        description: A list of operating systems which this flavour configuration
          can support e.g., RHEL Linux, Ubuntu 18.04 LTS, MS Windows 2012 R2.
        items:
          $ref: '#/definitions/models.OsType'
        type: array
      vpu:
        description: Number of Intel VPUs available
        type: integer
    type: object
  models.GpuInfo:
    properties:
      gpuMemory:
        description: GPU memory in Mbytes
        type: integer
      gpuModeName:
        description: Model name corresponding to vendorType may include info e.g.
          for NVIDIA, model name could be “Tesla M60”, “Tesla V100” etc.
        type: string
      gpuVendorType:
        description: GPU vendor name e.g. NVIDIA, AMD etc.
        type: string
      numGPU:
        description: Number of GPUs
        type: integer
    type: object
  models.HugePage:
    properties:
      number:
        description: Total number of huge pages
        type: integer
      pageSize:
        description: Size of hugepage
        type: string
    type: object
  models.InvalidParam:
    properties:
      param:
        type: string
      reason:
        type: string
    type: object
  models.MobileNetworkIds:
    properties:
      mcc:
        type: string
      mncs:
        items:
          type: string
        type: array
    type: object
  models.ObjectRepoLocation:
    properties:
      password:
        description: Password to access the repository
        type: string
      repoURL:
        type: string
      token:
        description: Authorization token to access the repository
        type: string
      userName:
        description: Username to access the repository
        type: string
    type: object
  models.OsType:
    properties:
      architecture:
        type: string
      distribution:
        type: string
      license:
        type: string
      version:
        type: string
    type: object
  models.ProblemDetails:
    properties:
      cause:
        description: Fixed string indicating cause of the issue
        type: string
      detail:
        description: Specific detail of the issue
        type: string
      invalidParams:
        items:
          $ref: '#/definitions/models.InvalidParam'
        type: array
      title:
        description: Summary of the problem
        type: string
    type: object
  models.ServiceEndpoint:
    properties:
      fqdn:
        type: string
      ipv4Addresses:
        items:
          type: string
        type: array
      ipv6Addresses:
        items:
          type: string
        type: array
      port:
        type: integer
    type: object
  models.State:
    properties:
      alarmState:
        description: Defines the alarm state during its life cycle (raised | updated
          | cleared).
        type: string
    type: object
  models.ZoneDetails:
    properties:
      geographyDetails:
        description: Details about cities or state covered by the edge. Details about
          the type of locality for eg rural, urban, industrial etc. This information
          is defined in human readable form.
        type: string
      geolocation:
        type: string
      vimId:
        description: vim id
        type: string
      zoneId:
        description: cluster id
        type: string
    type: object
  models.ZoneRegisteredData:
    properties:
      computeResourceQuotaLimits:
        description: Max quota on resources partner OP allows over reserved resources.
        items:
          $ref: '#/definitions/models.ComputeResourceInfo'
        type: array
      federationContextId:
        type: string
      flavoursSupported:
        items:
          $ref: '#/definitions/models.Flavour'
        type: array
      networkResources: {}
      reservedComputeResources:
        description: Resources exclusively reserved for the originator OP.
        items:
          $ref: '#/definitions/models.ComputeResourceInfo'
        type: array
      zoneId:
        type: string
      zoneServiceLevelObjsInfo:
        description: It is a measure of the actual amount of data that is being sent
          over a network per unit of time and indicates máximum supported value for
          a zone
    type: object
  models.ZoneRegistrationRequestData:
    properties:
      acceptedAvailabilityZones:
        items:
          type: string
        type: array
      availZoneNotifLink:
        type: string
    type: object
  models.ZoneRegistrationResponseData:
    properties:
      acceptedZoneResourceInfo:
        items:
          $ref: '#/definitions/models.ZoneRegisteredData'
        type: array
    type: object
host: localhost:8000
info:
  contact: {}
  description: This is the API documentation for the MEC Federator.
  title: MEC Federator API
  version: "1.0"
paths:
  /auth/token:
    post:
      consumes:
      - application/json
      description: Issue an access token from Keycloak
      parameters:
      - description: Client ID and Client Secret
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.AccessTokenRequestData'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.AccessToken'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ProblemDetails'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ProblemDetails'
      summary: Issue Access Token
      tags:
      - Authentication
  /ewbi/{federationContextId}/app_instances:
    post:
      consumes:
      - application/json
      description: Creates a new application instance in the specified zone and registers
        it in the orchestrator
      parameters:
      - description: Federation Context ID
        in: path
        name: federationContextId
        required: true
        type: string
      - description: Application instantiation request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.InstantiateApplicationRequest'
      produces:
      - application/json
      responses:
        "201":
          description: 'appInstanceId: id, nsId: id, vnfId: id'
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Invalid request body
          schema:
            $ref: '#/definitions/models.ProblemDetails'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ProblemDetails'
      summary: Create Application Instance
      tags:
      - EWBI - ApplicationInstanceLifecycleManagement
  /ewbi/{federationContextId}/app_instances/{appInstanceId}:
    delete:
      consumes:
      - application/json
      description: Terminates and removes an application instance from the orchestrator
        and database
      parameters:
      - description: Federation Context ID
        in: path
        name: federationContextId
        required: true
        type: string
      - description: Application Instance ID
        in: path
        name: appInstanceId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 'appInstanceId: id'
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Invalid request
          schema:
            $ref: '#/definitions/models.ProblemDetails'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ProblemDetails'
      summary: Delete Application Instance
      tags:
      - EWBI - ApplicationInstanceLifecycleManagement
    get:
      consumes:
      - application/json
      description: Retrieves detailed information about an application instance from
        the orchestrator
      parameters:
      - description: Federation Context ID
        in: path
        name: federationContextId
        required: true
        type: string
      - description: Application Instance ID
        in: path
        name: appInstanceId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.OrchAppI'
        "400":
          description: Invalid request
          schema:
            $ref: '#/definitions/models.ProblemDetails'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ProblemDetails'
      summary: Get Application Instance Details
      tags:
      - EWBI - ApplicationInstanceLifecycleManagement
  /ewbi/{federationContextId}/app_instances/{appInstanceId}/kdu/disable:
    post:
      consumes:
      - application/json
      description: Disables a Kubernetes Deployment Unit (KDU) within an application
        instance
      parameters:
      - description: Federation Context ID
        in: path
        name: federationContextId
        required: true
        type: string
      - description: Application Instance ID
        in: path
        name: appInstanceId
        required: true
        type: string
      - description: KDU disablement request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.DisableAppInstanceKDURequest'
      produces:
      - application/json
      responses:
        "200":
          description: 'appInstance: object, kduId: id, nsId: id'
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Invalid request body
          schema:
            $ref: '#/definitions/models.ProblemDetails'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ProblemDetails'
      summary: Disable Application Instance KDU
      tags:
      - EWBI - ApplicationInstanceLifecycleManagement
  /ewbi/{federationContextId}/app_instances/{appInstanceId}/kdu/enable:
    post:
      consumes:
      - application/json
      description: Enables a Kubernetes Deployment Unit (KDU) within an application
        instance on the specified node
      parameters:
      - description: Federation Context ID
        in: path
        name: federationContextId
        required: true
        type: string
      - description: Application Instance ID
        in: path
        name: appInstanceId
        required: true
        type: string
      - description: KDU enablement request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.EnableAppInstanceKDURequest'
      produces:
      - application/json
      responses:
        "200":
          description: 'appInstance: object, kduId: id, nsId: id'
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Invalid request body
          schema:
            $ref: '#/definitions/models.ProblemDetails'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ProblemDetails'
      summary: Enable Application Instance KDU
      tags:
      - EWBI - ApplicationInstanceLifecycleManagement
  /ewbi/{federationContextId}/app_instances/{appInstanceId}/node/migrate:
    post:
      consumes:
      - application/json
      description: Migrates a Kubernetes Deployment Unit (KDU) within an application
        instance to a different node
      parameters:
      - description: Federation Context ID
        in: path
        name: federationContextId
        required: true
        type: string
      - description: Application Instance ID
        in: path
        name: appInstanceId
        required: true
        type: string
      - description: Node migration request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.AppInstanceNodeMigrateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 'appInstanceId: id'
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Invalid request body
          schema:
            $ref: '#/definitions/models.ProblemDetails'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ProblemDetails'
      summary: Migrate Application Instance Node
      tags:
      - EWBI - ApplicationInstanceLifecycleManagement
  /ewbi/{federationContextId}/applications:
    post:
      consumes:
      - application/json
      description: Onboards an application to the orchestrator and creates an application
        object in the federation
      parameters:
      - description: Federation Context ID
        in: path
        name: federationContextId
        required: true
        type: string
      - description: Onboard Application Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.OnboardApplicationRequest'
      produces:
      - application/json
      responses:
        "201":
          description: 'message: Application onboarded successfully'
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Invalid request or validation error
          schema:
            $ref: '#/definitions/models.ProblemDetails'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ProblemDetails'
      summary: Onboard Application
      tags:
      - EWBI - ApplicationOnboarding
  /ewbi/{federationContextId}/applications/{appId}:
    delete:
      consumes:
      - application/json
      description: Removes an application from the orchestrator and deletes the application
        object from the federation
      parameters:
      - description: Federation Context ID
        in: path
        name: federationContextId
        required: true
        type: string
      - description: Application ID
        in: path
        name: appId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 'message: Application removed successfully'
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Invalid request or application has running instances
          schema:
            $ref: '#/definitions/models.ProblemDetails'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ProblemDetails'
      summary: Remove Application
      tags:
      - EWBI - ApplicationOnboarding
    get:
      consumes:
      - application/json
      description: Retrieves application details by application ID within a federation
      parameters:
      - description: Federation Context ID
        in: path
        name: federationContextId
        required: true
        type: string
      - description: Application ID
        in: path
        name: appId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Application'
        "400":
          description: Invalid request or application not found
          schema:
            $ref: '#/definitions/models.ProblemDetails'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ProblemDetails'
      summary: View Application
      tags:
      - EWBI - ApplicationOnboarding
    patch:
      consumes:
      - application/json
      description: Updates an application object in the federation
      parameters:
      - description: Federation Context ID
        in: path
        name: federationContextId
        required: true
        type: string
      - description: Application ID
        in: path
        name: appId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 'message: Application updated successfully'
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Invalid request
          schema:
            $ref: '#/definitions/models.ProblemDetails'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ProblemDetails'
      summary: Update Application
      tags:
      - EWBI - ApplicationOnboarding
  /ewbi/{federationContextId}/artefact:
    post:
      consumes:
      - multipart/form-data
      description: Receives and onboards an artefact from the origin operator. The
        artefact is a packaged file (zip/tar) containing application scripts and packaging
        files. The artefact is validated and stored in the database.
      parameters:
      - description: Federation Context ID
        in: path
        name: federationContextId
        required: true
        type: string
      - description: Artefact package file (zip/tar format)
        in: formData
        name: artefactFile
        required: true
        type: file
      - description: Unique identifier for the artefact
        in: formData
        name: artefactId
        required: true
        type: string
      - description: Application provider identifier
        in: formData
        name: appProviderId
        required: true
        type: string
      - description: Human-readable name of the artefact
        in: formData
        name: artefactName
        required: true
        type: string
      - description: Version information of the artefact
        in: formData
        name: artefactVersionInfo
        required: true
        type: string
      - description: Detailed description of the artefact
        in: formData
        name: artefactDescription
        required: true
        type: string
      - description: Virtualization type (e.g., container, VM)
        in: formData
        name: artefactVirtType
        required: true
        type: string
      - description: Descriptor file type (e.g., TOSCA, Helm)
        in: formData
        name: artefactDescriptorType
        required: true
        type: string
